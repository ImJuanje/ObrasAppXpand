<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17324d"><title>Tu obra</title><link rel="stylesheet" href="/styles.css"></head>
<body><header class="bar"><span class="brand">Tu obra</span></header><main id="app"><p>Cargando…</p></main>
<script>
const t=new URLSearchParams(location.search).get("t")||"",app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur=n=>Number(n).toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const fh=f=>new Date(f).toLocaleString("es-ES");
const lab=e=>e==="Enviado"||e==="Pendiente"?"Pendiente de tu decisión":e;
const bd=e=>`<span class="badge e-${esc(e)}">${esc(lab(e))}</span>`;
const api=async(a,d)=>{const r=await fetch("/api/"+a,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(d)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Error");return j};
const acts=(tp,id)=>`<div class="acts"><button class="si" data-t="${tp}" data-i="${id}" data-d="aprobar">Aprobar</button><button class="no" data-t="${tp}" data-i="${id}" data-d="rechazar">Rechazar</button></div>`;
const dec=d=>d?`<p class="hist">Decidido el ${fh(d.fecha)}${d.motivo?": "+esc(d.motivo):""}</p>`:"";
async function load(){let o;try{o=await api("portal-get",{t})}catch(x){app.innerHTML=`<h1>Enlace no disponible</h1><p class="sub">${esc(x.message)} Pide uno nuevo a tu reformista.</p>`;return}
const bi=p=>p.partidas.reduce((s,x)=>s+x.importe,0);
const pend=o.presupuestos.filter(p=>p.estado==="Enviado").length+o.modificados.filter(m=>m.estado==="Pendiente").length;
app.innerHTML=`<h1>${esc(o.cliente)}</h1><p class="sub">${esc(o.direccion)}</p><p>Estado de la obra: ${bd(o.estado)}</p>
<div class="aviso${pend?"":" libre"}">${pend?`Tienes ${pend} ${pend>1?"decisiones pendientes":"decisión pendiente"}.`:"No tienes nada pendiente de decidir."}</div>
<h2>Presupuesto</h2>${o.presupuestos.slice().reverse().map(p=>`<div class="box e-${p.estado}"><b>Versión ${p.v}</b> · ${bd(p.estado)}${p.nota?`<p class="sub">${esc(p.nota)}</p>`:""}${p.partidas.map(x=>`<div class="row"><span>${esc(x.desc)}</span><span>${eur(x.importe)}</span></div>`).join("")}<p class="calc">Base ${eur(bi(p))} · IVA ${o.iva}% ${eur(bi(p)*o.iva/100)}</p><div class="total">${eur(bi(p)*(1+o.iva/100))}</div>${p.decision?dec(p.decision):acts("presupuesto",p.v)}</div>`).join("")||"<p class='sub'>Todavía no hay presupuesto para revisar.</p>"}
<h2>Cambios sobre el presupuesto</h2>${o.modificados.slice().reverse().map(m=>`<div class="box e-${m.estado}"><b>Cambio ${m.n}</b> · ${bd(m.estado)}<p>${esc(m.desc)}</p><p class="sub">${m.partida?"Afecta a: "+esc(m.partida):"Trabajo nuevo"}${m.plazo?" · añade "+m.plazo+" días de plazo":""}</p><div>${Array.from({length:m.fotos},(_,i)=>`<img class="thumb" src="/api/portal-foto?t=${t}&k=${m.id}_${i}" alt="Foto ${i+1}">`).join("")}</div><p class="calc">${eur(m.coste)} + IVA ${o.iva}%</p><div class="total">${eur(m.coste*(1+o.iva/100))}</div>${m.decision?dec(m.decision):`<p class="hist">Este trabajo no empezará hasta que lo apruebes.</p>${acts("modificado",m.id)}`}</div>`).join("")||"<p class='sub'>No hay cambios pendientes.</p>"}`;
document.querySelectorAll("button[data-d]").forEach(b=>b.onclick=async()=>{const si=b.dataset.d==="aprobar";let motivo="";
if(si){if(!confirm("Vas a aprobar. Esta decisión no se puede deshacer."))return}else{motivo=prompt("Rechazar no se puede deshacer. Si quieres, cuéntanos el motivo:");if(motivo===null)return}
try{await api("portal-decide",{t,tipo:b.dataset.t,id:b.dataset.i,decision:b.dataset.d,motivo});load()}catch(x){alert(x.message);load()}})}
load();
</script></body></html>
