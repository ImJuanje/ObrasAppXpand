<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Obras</title>
<meta name="theme-color" content="#17324d"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"></head><body><main id="app"></main>
<script>
const $=(s)=>document.querySelector(s),app=$("#app");
const api=async(a,d)=>{const r=await fetch("/api/"+a,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(d||{})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Error");return j};
const esc=(s)=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function say(t,ok){const m=$(".msg");if(m){m.textContent=t;m.className="msg"+(ok?" ok":"")}}
function loginView(){app.innerHTML=`<div class="hero"><h1>Obras</h1><p>Presupuestos, cambios y aprobaciones de tus obras.</p></div><form id="f"><label>Usuario<input name="user" autocomplete="username" required></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label><label class="chk"><input type="checkbox" name="remember">Mantener sesión</label><p class="msg"></p><button>Entrar</button> <button type="button" class="sec" id="act">Tengo un código de alta</button></form>`;
$("#f").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.remember=!!d.remember;try{await api("login",d);start()}catch(x){say(x.message)}};$("#act").onclick=activateView}
function activateView(){app.innerHTML=`<h1>Crear mi acceso</h1><form id="f"><label>Código de alta<input name="code" required></label><label>Usuario<input name="user" autocomplete="username" required></label><label>Contraseña (mínimo 8)<input name="password" type="password" autocomplete="new-password" required></label><p class="msg"></p><button>Crear acceso</button> <button type="button" class="sec" id="b">Volver</button></form>`;
$("#b").onclick=loginView;$("#f").onsubmit=async e=>{e.preventDefault();try{await api("activate",Object.fromEntries(new FormData(e.target)));loginView();say("Acceso creado. Ya puedes entrar.",1)}catch(x){say(x.message)}}}
async function panel(me){
app.innerHTML=`<div class="bar in"><span class="brand"><i></i>Obras</span><span>${esc(me.user)} · ${me.role}<button class="out" id="out">Salir</button></span></div><div id="v"></div>`;
$("#out").onclick=async()=>{await api("logout");loginView()};
ME=me;const go=(k)=>{document.querySelectorAll(".tabs button").forEach(b=>b.className=b.id==="t_"+k?"on":"sec");({obras,team,ajustes})[k]()};
if(me.role!=="admin"){$("#v").innerHTML=`<div id="c"></div>`;obras();return}
$("#v").innerHTML=`<div class="tabs"><button id="t_obras">Obras</button><button id="t_team">Equipo</button><button id="t_ajustes">Ajustes</button></div><div id="c"></div>`;
["obras","team","ajustes"].forEach(k=>$("#t_"+k).onclick=()=>go(k));go("obras")}
async function team(){const t=await api("team-list");
$("#c").innerHTML=`<div class="box"><button id="inv" class="mt0">Generar código de alta</button><p class="msg"></p><h2>Códigos pendientes</h2>${t.invites.map(i=>`<div class="row"><code>${esc(i.code)}</code><button class="sec" data-c="${esc(i.code)}">Anular</button></div>`).join("")||"<p>No hay códigos pendientes.</p>"}<h2>Operarios</h2>${t.users.map(u=>`<div class="row"><span>${esc(u)}</span><button class="sec" data-u="${esc(u)}">Dar de baja</button></div>`).join("")||"<p>Aún no hay operarios. Genera un código y pásaselo.</p>"}</div>`;
$("#inv").onclick=async()=>{const r=await api("invite-create");await team();say("Código nuevo: "+r.code+" (caduca en 3 días)",1)};
document.querySelectorAll("[data-c]").forEach(b=>b.onclick=async()=>{await api("invite-delete",{code:b.dataset.c});team()});
document.querySelectorAll("[data-u]").forEach(b=>b.onclick=async()=>{if(confirm("¿Dar de baja a "+b.dataset.u+"?")){await api("user-delete",{user:b.dataset.u});team()}})}
async function ajustes(){const s=await api("settings-get");
$("#c").innerHTML=`<form id="f"><label>Tipos de reforma (uno por línea)<textarea name="tipos" rows="6">${esc(s.tipos.join("\n"))}</textarea></label><label>IVA por defecto (%)<input name="iva" type="number" step="0.5" value="${s.iva}"></label><p class="msg"></p><button>Guardar ajustes</button></form>`;
$("#f").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{await api("settings-set",{tipos:d.tipos.split("\n"),iva:d.iva});say("Ajustes guardados.",1)}catch(x){say(x.message)}}}
let ME;const bd=e=>`<span class="badge e-${esc(e).replace(/ /g,"-")}">${esc(e)}</span>`;const eur=(n)=>Number(n).toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
async function obras(){const l=await api("obras-list"),a=ME.role==="admin";
$("#c").innerHTML=(a?`<button id="nueva" class="mb">Nueva obra</button>`:"")+`<div class="box">${l.map(o=>`<div class="row"><span><b>${esc(o.cliente)}</b><small>${esc(o.direccion)}${a?" · "+esc(o.asignado):""}</small></span><span class="end">${bd(o.estado)}<button class="sec" data-o="${o.id}">Abrir</button></span></div>`).join("")||"<p>"+(a?"Aún no hay obras. Crea la primera.":"No tienes obras asignadas.")+"</p>"}</div>`;
if(a)$("#nueva").onclick=()=>obraForm();document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>obra(b.dataset.o))}
async function obraForm(o){const [s,t]=await Promise.all([api("settings-get"),api("team-list")]);o=o||{cliente:{},tipos:[],iva:s.iva,asignado:"admin"};
$("#c").innerHTML=`<form id="f"><label>Teléfono del cliente<input name="tel" value="${esc(o.cliente.tel||"")}" required></label><label>Nombre del cliente<input name="nombre" value="${esc(o.cliente.nombre||"")}" required></label><label>Dirección de la obra<input name="direccion" value="${esc(o.direccion||"")}" required></label><p class="lbl">Tipo de reforma <small>(elige uno o varios)</small></p><div class="chips">${s.tipos.map(x=>`<label class="chip"><input type="checkbox" name="tipos" value="${esc(x)}" ${o.tipos.includes(x)?"checked":""}><span>${esc(x)}</span></label>`).join("")}</div><label>Otro<input name="otro" value="${esc(o.otro||"")}"></label><label>Inicio previsto<input name="inicio" type="date" value="${esc(o.inicio||"")}"></label><label>Fin previsto<input name="fin" type="date" value="${esc(o.fin||"")}"></label><label>Responsable<select name="asignado"><option value="admin">Yo (admin)</option>${t.users.map(u=>`<option ${u===o.asignado?"selected":""}>${esc(u)}</option>`).join("")}</select></label><label>IVA de esta obra (%)<input name="iva" type="number" step="0.5" value="${o.iva}"></label><p class="msg"></p><button>Guardar obra</button> <button type="button" class="sec" id="b">Cancelar</button></form>`;
const f=$("#f");f.tel.onblur=async()=>{if(f.nombre.value)return;try{const c=await api("cliente-buscar",{tel:f.tel.value});if(c){f.nombre.value=c.nombre;say("Cliente conocido: datos rellenados.",1)}}catch{}};
$("#b").onclick=()=>o.id?obra(o.id):obras();
f.onsubmit=async e=>{e.preventDefault();const fd=new FormData(f),d=Object.fromEntries(fd);d.tipos=fd.getAll("tipos");d.id=o.id;try{const r=await api("obra-save",d);obra(r.id)}catch(x){say(x.message)}}}
const EST=["Presupuesto","Aprobada","En ejecución","Pendiente de cierre","Terminada"];const steps=e=>{const i=EST.indexOf(e);return `<ol class="steps">${EST.map((x,k)=>`<li class="${k<i?"hecho":k===i?"ahora":""}">${x}</li>`).join("")}</ol>`};
async function obra(id,tab){tab=tab||"pres";const o=await api("obra-get",{id}),a=ME.role==="admin";
const last=o.presupuestos[o.presupuestos.length-1],ms=o.modificados||[],link=o.token?location.origin+"/cliente.html?t="+o.token:"",
bloq=new Set(ms.filter(m=>!["Aprobado","Desbloqueado"].includes(m.estado)&&!m.reemplazado&&m.partida).map(m=>m.partida)),
tot=p=>{const b=p.partidas.reduce((s,x)=>s+x.importe,0);return `<div class="tot"><span class="calc">Base ${eur(b)} · IVA ${o.iva}% ${eur(b*o.iva/100)}</span><span class="total">${eur(b*(1+o.iva/100))}</span></div>`},
hh=x=>{const h=x.historial||[];return h.length?`<details class="hd"><summary>Historial (${h.length})</summary>${h.map(h=>`<div class="hist">${new Date(h.fecha).toLocaleString("es-ES")} · ${esc(h.quien)} · ${esc(h.accion)}${h.motivo?": "+esc(h.motivo):""}${a&&h.ip?" (IP "+esc(h.ip)+")":""}</div>`).join("")}</details>`:""},
vb=p=>`<div class="box e-${p.estado||"Borrador"}"><div class="bh"><b>Versión ${p.v}</b>${bd(p.estado||"Borrador")}<span class="sub">${new Date(p.fecha).toLocaleDateString("es-ES")}</span></div>${p.nota?`<p class="sub">${esc(p.nota)}</p>`:""}${p.partidas.map(x=>`<div class="row"><span>${esc(x.desc)}${p===last&&bloq.has(x.desc)?' <b class="hazard">Bloqueada: no ejecutar</b>':""}</span>${a?`<span>${eur(x.importe)}</span>`:""}</div>`).join("")}${a?tot(p):""}${hh(p)}</div>`,
mb=m=>{const bl=!["Aprobado","Desbloqueado"].includes(m.estado)&&!m.reemplazado;
const bt=(a&&m.estado==="Borrador"&&m.coste!=null?`<button data-me="${m.id}">Enviar al cliente</button>`:"")+(a&&m.estado==="Rechazado"&&!m.reemplazado?`<button data-mr="${m.id}">Replantear</button>`:"")+(a&&m.estado==="Borrador"?`<button class="sec" data-e="${m.id}">Editar</button>`:"")+(a&&bl?`<button class="sec" data-d="${m.id}">Desbloquear sin ok del cliente</button>`:"");
return `<div class="box e-${m.estado}"><div class="bh"><b>Modificado ${m.n}</b>${bd(m.estado)}</div>${bl?'<p><b class="hazard">No ejecutar hasta que el cliente apruebe</b></p>':""}<p>${esc(m.desc)}</p><p class="sub">${m.partida?"Afecta a: "+esc(m.partida):"Trabajo nuevo, no está en el presupuesto"}${m.plazo?" · +"+m.plazo+" días":""}${a&&m.coste!=null?" · "+eur(m.coste):""}</p><div>${Array.from({length:m.fotos},(_,i)=>`<img src="/api/foto?obra=${o.id}&k=${m.id}_${i}" alt="Foto ${i+1}" class="thumb">`).join("")}</div>${hh(m)}${bt?`<div class="btns">${bt}</div>`:""}</div>`};
const e=last&&(last.estado||"Borrador"),cpb=link?`<button class="sec" data-cp>Copiar enlace</button>`:`<button class="sec" data-rg>Generar enlace</button>`,nv=(t,c)=>`<button${c?` class="${c}"`:""} data-nv>${t}</button>`;
const P=!last?["Empieza por el presupuesto","Añade las partidas con su importe. Luego podrás enviarlo al cliente.",nv("Crear presupuesto")]
:e==="Borrador"?["Presupuesto listo para enviar","Revísalo y envíalo. Se crea el enlace para que el cliente lo vea y decida.",`<button data-pe="${last.v}">Enviar al cliente</button>`+nv("Nueva versión","sec")]
:e==="Enviado"?["Esperando al cliente","Ya puede aprobarlo o rechazarlo desde su enlace.",cpb+nv("Nueva versión","sec")]
:e==="Rechazado"?["El cliente lo ha rechazado","Mira el motivo en el historial y prepara una nueva versión.",nv("Nueva versión")]
:e==="Aprobado"?["Presupuesto aprobado","Si surge algo nuevo, regístralo en la pestaña Modificados.",""]:null;
const presForm=()=>{$("#c").innerHTML=`<form id="pf"><h2 class="mt0">${last?"Nueva versión del presupuesto":"Crear presupuesto"}</h2><p class="sub">Cada versión queda guardada. Empiezas con las partidas de la anterior.</p><div id="rows"></div><button type="button" class="sec" id="add">Añadir partida</button><div class="tot"><span class="calc" id="lc"></span><span class="total" id="lt"></span></div><label>Nota para el cliente<input name="nota"></label><p class="msg"></p><button>Guardar versión</button><button type="button" class="sec" id="cx">Cancelar</button></form>`;
const calc=()=>{const b=[...document.querySelectorAll("#rows .row")].reduce((s,r)=>s+(parseFloat(r.children[1].value)||0),0);$("#lc").textContent=`Base ${eur(b)} · IVA ${o.iva}% ${eur(b*o.iva/100)}`;$("#lt").textContent=eur(b*(1+o.iva/100))};
const row=(p={})=>{const d=document.createElement("div");d.className="row";d.innerHTML=`<input placeholder="Partida" value="${esc(p.desc||"")}" class="f3"><input type="number" step="0.01" min="0" placeholder="Importe" value="${p.importe??""}" class="f1"><button type="button" class="sec mt0">Quitar</button>`;d.oninput=calc;d.querySelector("button").onclick=()=>{d.remove();calc()};$("#rows").append(d)};
(last?last.partidas:[{}]).forEach(p=>row(p));$("#add").onclick=()=>row();calc();$("#cx").onclick=()=>obra(o.id,"pres");
$("#pf").onsubmit=async ev=>{ev.preventDefault();const partidas=[...document.querySelectorAll("#rows .row")].map(r=>({desc:r.children[0].value,importe:r.children[1].value}));try{await api("presupuesto-add",{id:o.id,partidas,nota:ev.target.nota.value});obra(o.id,"pres")}catch(x){say(x.message)}}};
const vPres=()=>(a&&P?`<div class="paso"><b>${P[0]}</b><p>${P[1]}</p>${P[2]?`<div class="btns">${P[2]}</div>`:""}</div>`:"")+(last?vb(last)+(o.presupuestos.length>1?`<details class="old"><summary>Versiones anteriores (${o.presupuestos.length-1})</summary>${o.presupuestos.slice(0,-1).reverse().map(vb).join("")}</details>`:""):(a?"":"<p>Aún no hay presupuesto.</p>")),
vMod=()=>`<button id="nm" class="mb">Nuevo modificado</button>`+(ms.length?ms.slice().reverse().map(mb).join(""):`<p class="sub">No hay modificados. Si surge un trabajo nuevo o un cambio sobre el presupuesto, regístralo aquí.</p>`),
vDat=()=>`<div class="box"><dl><div><dt>Teléfono</dt><dd>${esc(o.cliente.tel)}</dd></div><div><dt>Trabajos</dt><dd>${esc(o.tipos.concat(o.otro?[o.otro]:[]).join(", ")||"Sin tipo indicado")}</dd></div><div><dt>Plazo</dt><dd>${esc(o.inicio||"—")} a ${esc(o.fin||"—")}</dd></div><div><dt>Responsable</dt><dd>${esc(o.asignado)}</dd></div></dl>${a?`<div class="fa"><b>Enlace del cliente</b>${link?`<code class="link">${link}</code>`:`<p class="sub">Aún no hay enlace. Se crea al enviar el presupuesto, o puedes generarlo ahora.</p>`}<div class="btns">${link?`<button class="sec" data-cp>Copiar enlace</button><button class="sec" data-rg>Generar uno nuevo</button>`:`<button class="sec" data-rg>Generar enlace</button>`}<button class="sec" data-ed>Editar obra</button></div></div>`:""}${hh(o)}</div>`;
const fs=o.fases||[],hs=o.hitos||[],ix=EST.indexOf(o.estado),sig=EST[ix+1],ant=ix>1?EST[ix-1]:null,pb=p=>`<div class="pb"><i style="width:${p}%"></i></div>`,fd=d=>new Date(d+"T00:00").toLocaleDateString("es-ES"),gen=fs.length?Math.round(fs.reduce((s,f)=>s+f.pct,0)/fs.length):0;
const vAv=()=>(a?`<div class="paso"><b>Estado de la obra: ${esc(o.estado)}</b><p>${ix<1?"Se activará cuando el cliente apruebe el presupuesto.":sig?"Avanza el estado cuando cambie la situación de la obra. El cliente lo ve en su portal.":"La obra está terminada."}</p><div class="btns">${ix>=1&&sig?`<button data-st="${sig}">Pasar a ${sig}</button>`:""}${ant?`<button class="sec" data-st="${ant}">Volver a ${ant}</button>`:""}</div></div>`:"")+`<div class="box"><div class="bh"><b>Avance por fases</b>${fs.length?`<span class="sub">${gen}% en total</span>`:""}</div>${fs.length?fs.map(f=>`<div class="fase"><div class="fh"><span>${esc(f.nombre)}</span><b>${f.pct}%</b></div>${pb(f.pct)}</div>`).join(""):`<p class="sub">Aún no hay fases.${a?" Añade las que quieras que vea el cliente, por ejemplo Demolición, Fontanería o Pintura.":""}</p>`}${a?`<div class="btns"><button class="sec" data-fa>${fs.length?"Editar fases":"Añadir fases"}</button></div>`:""}</div>`;
const vCo=()=>{const okM=m=>m.estado==="Aprobado"||m.estado==="Desbloqueado",ap=o.presupuestos.find(p=>p.estado==="Aprobado"),obraT=((ap?ap.partidas.reduce((s,x)=>s+x.importe,0):0)+ms.filter(okM).reduce((s,m)=>s+(m.coste||0),0))*(1+o.iva/100),reg=hs.reduce((s,h)=>s+h.importe,0),cob=hs.filter(h=>h.cobrado).reduce((s,h)=>s+h.importe,0),hoy=new Date().toISOString().slice(0,10);
return `<div class="box"><div class="bh"><b>Hitos de cobro</b></div>${hs.length?`<p class="calc">Cobrado ${eur(cob)} de ${eur(reg)} registrados${obraT?` · Obra aprobada: ${eur(obraT)} con IVA`:""}</p>${pb(reg?Math.round(cob/reg*100):0)}`+hs.map((h,i)=>`<div class="row"><span><b>${esc(h.concepto)}</b><small>${h.fecha?fd(h.fecha):"Sin fecha"} · ${eur(h.importe)}</small></span><span class="end">${bd(h.cobrado?"Cobrado":h.fecha&&h.fecha<hoy?"Vencido":"Pendiente")}<button class="sec" data-hc="${i}">${h.cobrado?"Marcar pendiente":"Marcar cobrado"}</button></span></div>`).join(""):`<p class="sub">Aún no hay hitos. Registra cuánto se cobra y cuándo, por ejemplo al empezar y al terminar. Solo se anotan: el cobro se hace fuera de la app.</p>`}<div class="btns"><button class="sec" data-ha>${hs.length?"Editar hitos":"Añadir hitos"}</button></div></div>`};
const fasForm=()=>{$("#c").innerHTML=`<form id="ff"><h2 class="mt0">Fases de la obra</h2><p class="sub">El cliente verá estas fases y su avance en su portal.</p><div id="rows"></div><button type="button" class="sec" id="add">Añadir fase</button><p class="msg"></p><button>Guardar fases</button><button type="button" class="sec" id="cx">Cancelar</button></form>`;
const row=(f={})=>{const d=document.createElement("div");d.className="row";d.innerHTML=`<input placeholder="Fase (ej. Fontanería)" value="${esc(f.nombre||"")}" class="f3"><input type="number" min="0" max="100" step="5" placeholder="%" value="${f.pct??0}" class="pc" aria-label="Porcentaje de avance"><button type="button" class="sec mt0">Quitar</button>`;d.querySelector("button").onclick=()=>d.remove();$("#rows").append(d)};
(fs.length?fs:[{}]).forEach(f=>row(f));$("#add").onclick=()=>row();$("#cx").onclick=()=>obra(o.id,"av");
$("#ff").onsubmit=async ev=>{ev.preventDefault();const fases=[...document.querySelectorAll("#rows .row")].map(r=>({nombre:r.children[0].value,pct:r.children[1].value}));try{await api("fases-set",{id:o.id,fases});obra(o.id,"av")}catch(x){say(x.message)}}};
const hitForm=()=>{$("#c").innerHTML=`<form id="hf"><h2 class="mt0">Hitos de cobro</h2><p class="sub">Importes con IVA incluido. Solo se registran: el cobro se hace fuera de la app.</p><div id="rows"></div><button type="button" class="sec" id="add">Añadir hito</button><p class="msg"></p><button>Guardar hitos</button><button type="button" class="sec" id="cx">Cancelar</button></form>`;
const row=(h={})=>{const d=document.createElement("div");d.className="hf";d.innerHTML=`<input class="c" placeholder="Concepto (ej. Al empezar la obra)" value="${esc(h.concepto||"")}"><div class="hf2"><input class="d" type="date" value="${esc(h.fecha||"")}" aria-label="Fecha prevista"><input class="i" type="number" min="0" step="0.01" placeholder="Importe €" value="${h.importe??""}"></div><div class="hf3"><label class="chk"><input class="k" type="checkbox" ${h.cobrado?"checked":""}>Cobrado</label><button type="button" class="sec mt0">Quitar</button></div>`;d.querySelector("button").onclick=()=>d.remove();$("#rows").append(d)};
(hs.length?hs:[{}]).forEach(h=>row(h));$("#add").onclick=()=>row();$("#cx").onclick=()=>obra(o.id,"co");
$("#hf").onsubmit=async ev=>{ev.preventDefault();const hitos=[...document.querySelectorAll("#rows .hf")].map(r=>({concepto:r.querySelector(".c").value,fecha:r.querySelector(".d").value,importe:r.querySelector(".i").value,cobrado:r.querySelector(".k").checked}));try{await api("hitos-set",{id:o.id,hitos});obra(o.id,"co")}catch(x){say(x.message)}}};
$("#c").innerHTML=`<button class="sec mb" id="b">Volver a obras</button><div class="box ficha"><div class="bh"><h1>${esc(o.cliente.nombre)}</h1>${bd(o.estado)}</div><p class="sub">${esc(o.direccion)}</p>${steps(o.estado)}</div><div class="stabs">${[["pres","Presupuesto"],["mod","Modificados"+(ms.length?" ("+ms.length+")":"")],["av","Avance"],...(a?[["co","Cobros"]]:[]),["dat","Datos"]].map(([k,t])=>`<button class="${k===tab?"on":""}" data-t="${k}">${t}</button>`).join("")}</div>${({pres:vPres,mod:vMod,av:vAv,co:vCo,dat:vDat})[tab]()}`;
const q=(s,f)=>document.querySelectorAll(s).forEach(f),act=async(n,d)=>{try{await api(n,d);obra(o.id,tab)}catch(x){alert(x.message)}};
$("#b").onclick=obras;q(".stabs button",b=>b.onclick=()=>obra(o.id,b.dataset.t));
if($("#nm"))$("#nm").onclick=()=>modForm(o);
q("[data-nv]",b=>b.onclick=presForm);
q("[data-pe]",b=>b.onclick=async()=>{try{if(!o.token)await api("enlace-generar",{id:o.id});await api("presupuesto-enviar",{id:o.id,v:b.dataset.pe});obra(o.id,tab)}catch(x){alert(x.message)}});
q("[data-st]",b=>b.onclick=()=>{const s=b.dataset.st;if(EST.indexOf(s)<ix&&!confirm("¿Volver la obra a «"+s+"»?"))return;if(s==="Terminada"){const n=hs.filter(h=>!h.cobrado).length,p=ms.filter(m=>m.estado==="Pendiente").length;if((n||p)&&!confirm("Antes de cerrar: "+[n?n+" hito(s) sin cobrar":"",p?p+" modificado(s) sin decidir":""].filter(Boolean).join(" y ")+". ¿Marcar la obra como terminada?"))return}act("obra-estado",{id:o.id,estado:s})});
q("[data-fa]",b=>b.onclick=fasForm);q("[data-ha]",b=>b.onclick=hitForm);
q("[data-hc]",b=>b.onclick=()=>act("hitos-set",{id:o.id,hitos:hs.map((h,i)=>i===+b.dataset.hc?{...h,cobrado:!h.cobrado}:h)}));
q("[data-me]",b=>b.onclick=()=>act("modificado-enviar",{id:o.id,mid:b.dataset.me}));
q("[data-mr]",b=>b.onclick=()=>act("modificado-replantear",{id:o.id,mid:b.dataset.mr}));
q("[data-e]",b=>b.onclick=()=>modForm(o,ms.find(m=>m.id===b.dataset.e)));
q("[data-d]",b=>b.onclick=async()=>{const motivo=prompt("Motivo del desbloqueo (quedará registrado):");if(!motivo)return;try{await api("modificado-desbloquear",{id:o.id,mid:b.dataset.d,motivo});obra(o.id,tab)}catch(x){alert(x.message)}});
q("[data-rg]",b=>b.onclick=()=>{if(o.token&&!confirm("El enlace anterior dejará de funcionar. ¿Generar uno nuevo?"))return;act("enlace-generar",{id:o.id})});
q("[data-cp]",b=>b.onclick=()=>navigator.clipboard.writeText(link).then(()=>alert("Enlace copiado.")));
q("[data-ed]",b=>b.onclick=()=>obraForm(o))}
function foto(f){return new Promise((ok,ko)=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",.7))};i.onerror=()=>ko(new Error("No se pudo leer una foto."));i.src=u})}
function modForm(o,m){const last=o.presupuestos[o.presupuestos.length-1],a=ME.role==="admin";m=m||{};
$("#c").innerHTML=`<form id="f"><h2>${m.id?"Editar":"Nuevo"} modificado</h2><label>Qué cambia<input name="desc" value="${esc(m.desc||"")}" required></label><label>Partida afectada<select name="partida"><option value="">Trabajo nuevo (no está en el presupuesto)</option>${(last?last.partidas:[]).map(x=>`<option ${x.desc===m.partida?"selected":""}>${esc(x.desc)}</option>`).join("")}</select></label><label>Días que añade al plazo<input name="plazo" type="number" min="0" value="${m.plazo||0}"></label>${a?`<label>Coste (sin IVA, €)<input name="coste" type="number" step="0.01" min="0" value="${m.coste??""}"></label>`:""}${m.id?"":`<label>Fotos (máximo 5)<input name="fotos" type="file" accept="image/*" multiple></label>`}<p class="msg"></p><button>Guardar modificado</button> <button type="button" class="sec" id="b">Cancelar</button></form>`;
$("#b").onclick=()=>obra(o.id,"mod");
$("#f").onsubmit=async e=>{e.preventDefault();const f=e.target,d={id:o.id,mid:m.id,desc:f.desc.value,partida:f.partida.value,plazo:f.plazo.value,coste:a?f.coste.value:undefined};try{if(!m.id)d.fotos=await Promise.all([...f.fotos.files].slice(0,5).map(foto));await api(m.id?"modificado-edit":"modificado-add",d);obra(o.id,"mod")}catch(x){say(x.message)}}}
async function start(){try{panel(await api("me"))}catch{loginView()}}
start();
</script></body></html>
