<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Obras</title>
<meta name="theme-color" content="#17324d"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"></head><body><main id="app"></main>
<script>
const $=(s)=>document.querySelector(s),app=$("#app");
const api=async(a,d)=>{const r=await fetch("/api/"+a,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(d||{})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Error");return j};
const esc=(s)=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function say(t,ok){const m=$(".msg");if(m){m.textContent=t;m.className="msg"+(ok?" ok":"")}}
function loginView(){app.innerHTML=`<div class="hero"><h1>Obras</h1><p>Presupuestos, cambios y aprobaciones de tus obras.</p></div><form id="f"><label>Usuario<input name="user" autocomplete="username" required></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label><label class="chk"><input type="checkbox" name="remember">Mantener sesión</label><p class="msg"></p><button>Entrar</button> <button type="button" class="sec" id="act">Tengo un código de alta</button></form>`;
$("#f").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.remember=!!d.remember;try{await api("login",d);start()}catch(x){say(x.message)}};$("#act").onclick=activateView}
function activateView(){app.innerHTML=`<h1>Crear mi acceso</h1><form id="f"><label>Código de alta<input name="code" required></label><label>Usuario<input name="user" autocomplete="username" required></label><label>Contraseña (mínimo 8)<input name="password" type="password" autocomplete="new-password" required></label><p class="msg"></p><button>Crear acceso</button> <button type="button" class="sec" id="b">Volver</button></form>`;
$("#b").onclick=loginView;$("#f").onsubmit=async e=>{e.preventDefault();try{await api("activate",Object.fromEntries(new FormData(e.target)));loginView();say("Acceso creado. Ya puedes entrar.",1)}catch(x){say(x.message)}}}
async function panel(me){
app.innerHTML=`<div class="bar in"><span class="brand"><i></i>Obras</span><span>${esc(me.user)} · ${me.role}<button class="out" id="out">Salir</button></span></div><div id="v"></div>`;
$("#out").onclick=async()=>{await api("logout");loginView()};
ME=me;const go=(k)=>{document.querySelectorAll(".tabs button").forEach(b=>b.className=b.id==="t_"+k?"on":"sec");({obras,team,ajustes})[k]()};
if(me.role!=="admin"){$("#v").innerHTML=`<div id="c"></div>`;obras();return}
$("#v").innerHTML=`<div class="tabs"><button id="t_obras">Obras</button><button id="t_team">Equipo</button><button id="t_ajustes">Ajustes</button></div><div id="c"></div>`;
["obras","team","ajustes"].forEach(k=>$("#t_"+k).onclick=()=>go(k));go("obras")}
async function team(){const t=await api("team-list");
$("#c").innerHTML=`<div class="box"><button id="inv" class="mt0">Generar código de alta</button><p class="msg"></p><h2>Códigos pendientes</h2>${t.invites.map(i=>`<div class="row"><code>${esc(i.code)}</code><button class="sec" data-c="${esc(i.code)}">Anular</button></div>`).join("")||"<p>No hay códigos pendientes.</p>"}<h2>Operarios</h2>${t.users.map(u=>`<div class="row"><span>${esc(u)}</span><button class="sec" data-u="${esc(u)}">Dar de baja</button></div>`).join("")||"<p>Aún no hay operarios. Genera un código y pásaselo.</p>"}</div>`;
$("#inv").onclick=async()=>{const r=await api("invite-create");await team();say("Código nuevo: "+r.code+" (caduca en 3 días)",1)};
document.querySelectorAll("[data-c]").forEach(b=>b.onclick=async()=>{await api("invite-delete",{code:b.dataset.c});team()});
document.querySelectorAll("[data-u]").forEach(b=>b.onclick=async()=>{if(confirm("¿Dar de baja a "+b.dataset.u+"?")){await api("user-delete",{user:b.dataset.u});team()}})}
async function ajustes(){const s=await api("settings-get");
$("#c").innerHTML=`<form id="f"><label>Tipos de reforma (uno por línea)<textarea name="tipos" rows="6">${esc(s.tipos.join("\n"))}</textarea></label><label>IVA por defecto (%)<input name="iva" type="number" step="0.5" value="${s.iva}"></label><p class="msg"></p><button>Guardar ajustes</button></form>`;
$("#f").onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{await api("settings-set",{tipos:d.tipos.split("\n"),iva:d.iva});say("Ajustes guardados.",1)}catch(x){say(x.message)}}}
let ME;const bd=e=>`<span class="badge e-${esc(e)}">${esc(e)}</span>`;const eur=(n)=>Number(n).toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
async function obras(){const l=await api("obras-list"),a=ME.role==="admin";
$("#c").innerHTML=(a?`<button id="nueva" class="mb">Nueva obra</button>`:"")+`<div class="box">${l.map(o=>`<div class="row"><span><b>${esc(o.cliente)}</b><small>${esc(o.direccion)}${a?" · "+esc(o.asignado):""}</small></span><span class="end">${bd(o.estado)}<button class="sec" data-o="${o.id}">Abrir</button></span></div>`).join("")||"<p>"+(a?"Aún no hay obras. Crea la primera.":"No tienes obras asignadas.")+"</p>"}</div>`;
if(a)$("#nueva").onclick=()=>obraForm();document.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>obra(b.dataset.o))}
async function obraForm(o){const [s,t]=await Promise.all([api("settings-get"),api("team-list")]);o=o||{cliente:{},tipos:[],iva:s.iva,asignado:"admin"};
$("#c").innerHTML=`<form id="f"><label>Teléfono del cliente<input name="tel" value="${esc(o.cliente.tel||"")}" required></label><label>Nombre del cliente<input name="nombre" value="${esc(o.cliente.nombre||"")}" required></label><label>Dirección de la obra<input name="direccion" value="${esc(o.direccion||"")}" required></label><p>Tipo de reforma</p>${s.tipos.map(x=>`<label class="chk"><input type="checkbox" name="tipos" value="${esc(x)}" ${o.tipos.includes(x)?"checked":""}>${esc(x)}</label>`).join("")}<label>Otro<input name="otro" value="${esc(o.otro||"")}"></label><label>Inicio previsto<input name="inicio" type="date" value="${esc(o.inicio||"")}"></label><label>Fin previsto<input name="fin" type="date" value="${esc(o.fin||"")}"></label><label>Responsable<select name="asignado"><option value="admin">Yo (admin)</option>${t.users.map(u=>`<option ${u===o.asignado?"selected":""}>${esc(u)}</option>`).join("")}</select></label><label>IVA de esta obra (%)<input name="iva" type="number" step="0.5" value="${o.iva}"></label><p class="msg"></p><button>Guardar obra</button> <button type="button" class="sec" id="b">Cancelar</button></form>`;
const f=$("#f");f.tel.onblur=async()=>{if(f.nombre.value)return;try{const c=await api("cliente-buscar",{tel:f.tel.value});if(c){f.nombre.value=c.nombre;say("Cliente conocido: datos rellenados.",1)}}catch{}};
$("#b").onclick=()=>o.id?obra(o.id):obras();
f.onsubmit=async e=>{e.preventDefault();const fd=new FormData(f),d=Object.fromEntries(fd);d.tipos=fd.getAll("tipos");d.id=o.id;try{const r=await api("obra-save",d);obra(r.id)}catch(x){say(x.message)}}}
const EST=["Presupuesto","Aprobada","En ejecución","Pendiente de cierre","Terminada"];const steps=e=>{const i=EST.indexOf(e);return `<ol class="steps">${EST.map((x,k)=>`<li class="${k<i?"hecho":k===i?"ahora":""}">${x}</li>`).join("")}</ol>`};
async function obra(id){const o=await api("obra-get",{id}),a=ME.role==="admin";
const tot=(p)=>{const b=p.partidas.reduce((s,x)=>s+x.importe,0);return `<div class="tot"><span class="calc">Base ${eur(b)} · IVA ${o.iva}% ${eur(b*o.iva/100)}</span><span class="total">${eur(b*(1+o.iva/100))}</span></div>`};
const last=o.presupuestos[o.presupuestos.length-1],ms=o.modificados||[],bloq=new Set(ms.filter(m=>!["Aprobado","Desbloqueado"].includes(m.estado)&&!m.reemplazado&&m.partida).map(m=>m.partida));
$("#c").innerHTML=`<button class="sec mb" id="b">Volver a obras</button><div class="box ficha"><div class="bh"><h1>${esc(o.cliente.nombre)}</h1>${bd(o.estado)}</div><p class="sub">${esc(o.direccion)}</p>${steps(o.estado)}<dl><div><dt>Teléfono</dt><dd>${esc(o.cliente.tel)}</dd></div><div><dt>Trabajos</dt><dd>${esc(o.tipos.concat(o.otro?[o.otro]:[]).join(", ")||"Sin tipo indicado")}</dd></div><div><dt>Plazo</dt><dd>${esc(o.inicio||"—")} a ${esc(o.fin||"—")}</dd></div><div><dt>Responsable</dt><dd>${esc(o.asignado)}</dd></div></dl>${a?`<div class="fa"><b>Enlace del cliente</b>${o.token?`<code class="link">${location.origin}/cliente.html?t=${o.token}</code>`:""}<div class="btns">${o.token?`<button class="sec" id="cp">Copiar enlace</button><button class="sec" id="rg">Generar uno nuevo</button>`:`<button class="sec" id="rg">Generar enlace</button>`}<button class="sec" id="ed">Editar obra</button></div></div>`:""}</div><h2>Presupuesto</h2>${o.presupuestos.slice().reverse().map(p=>`<div class="box e-${p.estado||"Borrador"}"><div class="bh"><b>Versión ${p.v}</b>${bd(p.estado||"Borrador")}<span class="sub">${new Date(p.fecha).toLocaleDateString("es-ES")}</span></div>${(p.historial||[]).map(h=>`<div class="hist">${new Date(h.fecha).toLocaleString("es-ES")} · ${esc(h.quien)} · ${esc(h.accion)}${h.motivo?": "+esc(h.motivo):""}${a&&h.ip?" (IP "+esc(h.ip)+")":""}</div>`).join("")}${a&&p===last&&(!p.estado||p.estado==="Borrador")?`<br><button data-pe="${p.v}">Enviar al cliente</button>`:""}${p.nota?"<br>"+esc(p.nota):""}${p.partidas.map(x=>`<div class="row"><span>${esc(x.desc)}${p===last&&bloq.has(x.desc)?' <b class="hazard">Bloqueada: no ejecutar</b>':""}</span>${a?`<span>${eur(x.importe)}</span>`:""}</div>`).join("")}${a?tot(p):""}</div>`).join("")||"<p>Aún no hay presupuesto.</p>"}<h2>Modificados</h2>${ms.slice().reverse().map(m=>{const bl=!["Aprobado","Desbloqueado"].includes(m.estado)&&!m.reemplazado;return `<div class="box e-${m.estado}"><div class="bh"><b>Modificado ${m.n}</b>${bd(m.estado)}</div>${bl?'<p><b class="hazard">No ejecutar hasta que el cliente apruebe</b></p>':""}<p>${esc(m.desc)}</p><p class="sub">${m.partida?"Afecta a: "+esc(m.partida):"Trabajo nuevo, no está en el presupuesto"}${m.plazo?" · +"+m.plazo+" días":""}${a&&m.coste!=null?" · "+eur(m.coste):""}</p><div>${Array.from({length:m.fotos},(_,i)=>`<img src="/api/foto?obra=${o.id}&k=${m.id}_${i}" alt="Foto ${i+1}" class="thumb">`).join("")}</div>${m.historial.map(h=>`<div class="hist">${new Date(h.fecha).toLocaleDateString("es-ES")} · ${esc(h.quien)} · ${esc(h.accion)}${h.motivo?": "+esc(h.motivo):""}${a&&h.ip?" (IP "+esc(h.ip)+")":""}</div>`).join("")}${a&&m.estado==="Borrador"&&m.coste!=null?`<button data-me="${m.id}">Enviar al cliente</button> `:""}${a&&m.estado==="Rechazado"&&!m.reemplazado?`<button data-mr="${m.id}">Replantear</button> `:""}${a&&m.estado==="Borrador"?`<button class="sec" data-e="${m.id}">Editar</button> `:""}${a&&bl?`<button class="sec" data-d="${m.id}">Desbloquear sin ok del cliente</button>`:""}</div>`}).join("")||"<p>No hay modificados.</p>"}<button id="nm">Nuevo modificado</button>${a?`<form id="pf"><h2>Nueva versión</h2><div id="rows"></div><button type="button" class="sec" id="add">Añadir partida</button><label>Nota<input name="nota"></label><p class="msg"></p><button>Guardar versión</button></form>`:""}`;
$("#b").onclick=obras;$("#nm").onclick=()=>modForm(o);document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>modForm(o,ms.find(m=>m.id===b.dataset.e)));
document.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{const motivo=prompt("Motivo del desbloqueo (quedará registrado):");if(!motivo)return;try{await api("modificado-desbloquear",{id:o.id,mid:b.dataset.d,motivo});obra(o.id)}catch(x){alert(x.message)}});if(!a)return;$("#ed").onclick=()=>obraForm(o);
const act=async(n,d)=>{try{await api(n,d);obra(o.id)}catch(x){alert(x.message)}};
$("#rg").onclick=()=>{if(o.token&&!confirm("El enlace anterior dejará de funcionar. ¿Generar uno nuevo?"))return;act("enlace-generar",{id:o.id})};
if($("#cp"))$("#cp").onclick=()=>navigator.clipboard.writeText(location.origin+"/cliente.html?t="+o.token).then(()=>alert("Enlace copiado."));
document.querySelectorAll("[data-pe]").forEach(b=>b.onclick=()=>act("presupuesto-enviar",{id:o.id,v:b.dataset.pe}));
document.querySelectorAll("[data-me]").forEach(b=>b.onclick=()=>act("modificado-enviar",{id:o.id,mid:b.dataset.me}));
document.querySelectorAll("[data-mr]").forEach(b=>b.onclick=()=>act("modificado-replantear",{id:o.id,mid:b.dataset.mr}));
const row=(p={})=>{const d=document.createElement("div");d.className="row";d.innerHTML=`<input placeholder="Partida" value="${esc(p.desc||"")}" class="f3"><input type="number" step="0.01" min="0" placeholder="Importe" value="${p.importe??""}" class="f1"><button type="button" class="sec mt0">Quitar</button>`;d.querySelector("button").onclick=()=>d.remove();$("#rows").append(d)};
(last?last.partidas:[{}]).forEach(row);$("#add").onclick=()=>row();
$("#pf").onsubmit=async e=>{e.preventDefault();const partidas=[...document.querySelectorAll("#rows .row")].map(r=>({desc:r.children[0].value,importe:r.children[1].value}));try{await api("presupuesto-add",{id:o.id,partidas,nota:e.target.nota.value});obra(o.id)}catch(x){say(x.message)}}}
function foto(f){return new Promise((ok,ko)=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",.7))};i.onerror=()=>ko(new Error("No se pudo leer una foto."));i.src=u})}
function modForm(o,m){const last=o.presupuestos[o.presupuestos.length-1],a=ME.role==="admin";m=m||{};
$("#c").innerHTML=`<form id="f"><h2>${m.id?"Editar":"Nuevo"} modificado</h2><label>Qué cambia<input name="desc" value="${esc(m.desc||"")}" required></label><label>Partida afectada<select name="partida"><option value="">Trabajo nuevo (no está en el presupuesto)</option>${(last?last.partidas:[]).map(x=>`<option ${x.desc===m.partida?"selected":""}>${esc(x.desc)}</option>`).join("")}</select></label><label>Días que añade al plazo<input name="plazo" type="number" min="0" value="${m.plazo||0}"></label>${a?`<label>Coste (sin IVA, €)<input name="coste" type="number" step="0.01" min="0" value="${m.coste??""}"></label>`:""}${m.id?"":`<label>Fotos (máximo 5)<input name="fotos" type="file" accept="image/*" multiple></label>`}<p class="msg"></p><button>Guardar modificado</button> <button type="button" class="sec" id="b">Cancelar</button></form>`;
$("#b").onclick=()=>obra(o.id);
$("#f").onsubmit=async e=>{e.preventDefault();const f=e.target,d={id:o.id,mid:m.id,desc:f.desc.value,partida:f.partida.value,plazo:f.plazo.value,coste:a?f.coste.value:undefined};try{if(!m.id)d.fotos=await Promise.all([...f.fotos.files].slice(0,5).map(foto));await api(m.id?"modificado-edit":"modificado-add",d);obra(o.id)}catch(x){say(x.message)}}}
async function start(){try{panel(await api("me"))}catch{loginView()}}
start();
</script></body></html>
